<text x="190" y="486" font-family="Inter" font-size="14" font-weight="bold" fill="#393C41" text-anchor="middle" letter-spacing="1.4">CAR IDLE</text>
<text x="190" y="508" font-family="Inter Medium" font-size="14" font-weight="normal" fill="#8A8D93" text-anchor="middle">where it was parked</text>
<circle cx="640" cy="430" r="19" fill="#3E6AE1" stroke="#3E6AE1" stroke-width="7"/>
<text x="640" y="486" font-family="Inter" font-size="14" font-weight="bold" fill="#393C41" text-anchor="middle" letter-spacing="1.4">PICKUP</text>
<text x="640" y="508" font-family="Inter Medium" font-size="14" font-weight="normal" fill="#8A8D93" text-anchor="middle">meter starts here</text>
<circle cx="1420" cy="430" r="19" fill="#3E6AE1" stroke="#3E6AE1" stroke-width="7"/>
<text x="1420" y="486" font-family="Inter" font-size="14" font-weight="bold" fill="#393C41" text-anchor="middle" letter-spacing="1.4">DROP-OFF</text>
<text x="1420" y="508" font-family="Inter Medium" font-size="14" font-weight="normal" fill="#8A8D93" text-anchor="middle">meter stops</text>
<text x="415.0" y="396" font-family="Inter ExtraBold" font-size="19" font-weight="normal" fill="#393C41" text-anchor="middle" letter-spacing="0.6">0.7 mi  ·  EMPTY</text>
<text x="415.0" y="418" font-family="Inter Medium" font-size="15" font-weight="normal" fill="#C0392B" text-anchor="middle">nobody pays for this</text>
<text x="1030.0" y="396" font-family="Inter ExtraBold" font-size="19" font-weight="normal" fill="#2F55C4" text-anchor="middle" letter-spacing="0.6">1.3 mi  ·  PAYING</text>
<text x="1030.0" y="418" font-family="Inter Medium" font-size="15" font-weight="normal" fill="#5C5E62" text-anchor="middle">the only part on the meter</text>
<text x="64" y="584" font-family="Inter" font-size="13" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="2">WHAT YOU ACTUALLY KEEP</text>
<rect x="64" y="600" width="1472" height="64" rx="10" fill="rgba(23,26,32,0.10)" opacity="1"/>
<rect x="64" y="600" width="1103.787406123628" height="64" rx="10" fill="#3E6AE1" opacity="1"/>
<text x="86" y="641" font-family="Inter" font-size="23" font-weight="bold" fill="#FFFFFF" text-anchor="start">$12.98  you keep</text>
<text x="1514" y="640" font-family="Inter SemiBold" font-size="19" font-weight="normal" fill="#5C5E62" text-anchor="end">$4.33 commission</text>
<text x="64" y="692" font-family="Inter Medium" font-size="17" font-weight="normal" fill="#5C5E62" text-anchor="start">$17.31 on the meter  ·  Hitchr takes 25%</text>
<rect x="64" y="720" width="1472" height="84" rx="14" fill="rgba(62,106,225,0.08)" stroke="rgba(62,106,225,0.22)" stroke-width="1" opacity="1"/>
<text x="96" y="754" font-family="Inter" font-size="23" font-weight="bold" fill="#171A20" text-anchor="start">2.0 miles driven. 0.7 of them for free — 35% of the trip.</text>
<text x="96" y="782" font-family="Inter Medium" font-size="17" font-weight="normal" fill="#393C41" text-anchor="start">Those empty miles come out of the $12.98, not the $17.31. That is a deadhead, and it is what the game is named after.</text>
