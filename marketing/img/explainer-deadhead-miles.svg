<text x="64" y="96" font-family="Inter ExtraBold" font-size="44" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-0.9">Every offer gives you three numbers.</text>
<text x="64" y="142" font-family="Inter Medium" font-size="27" font-weight="normal" fill="#5C5E62" text-anchor="start">Only the third one decides whether you made money.</text>
