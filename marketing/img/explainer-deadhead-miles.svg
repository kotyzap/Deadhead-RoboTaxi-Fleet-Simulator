<text x="98" y="226" font-family="Inter" font-size="12" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="1.6">HITCHR</text>
<text x="168" y="228" font-family="Inter" font-size="22" font-weight="bold" fill="#171A20" text-anchor="start">Deep Ellum</text>
