<text x="332" y="228" font-family="Inter Medium" font-size="22" font-weight="normal" fill="#393C41" text-anchor="start">Victory Park</text>
<text x="98" y="256" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#5C5E62" text-anchor="start">1.3 mi  ·  4 min  ·  0.7 mi deadhead  ·  $17.31 fare less 25%</text>
<text x="1502" y="240" font-family="Inter ExtraBold" font-size="32" font-weight="normal" fill="#171A20" text-anchor="end">$12.98</text>
<text x="64" y="350" font-family="Inter" font-size="13" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="2">WHAT YOU ACTUALLY DRIVE</text>
<line x1="190" y1="430" x2="640" y2="430" stroke="#8E8E8E" stroke-width="14" stroke-linecap="round" stroke-dasharray="3 26"/>
<line x1="640" y1="430" x2="1420" y2="430" stroke="#3E6AE1" stroke-width="14" stroke-linecap="round"/>
