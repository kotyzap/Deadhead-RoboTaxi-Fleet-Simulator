<text x="64" y="250" font-family="Inter ExtraBold" font-size="46" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-1">Five cities teach you</text>
<text x="64" y="300" font-family="Inter ExtraBold" font-size="46" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-1">to run a fleet.</text>
<text x="64" y="358" font-family="Inter ExtraBold" font-size="46" font-weight="normal" fill="#187A4A" text-anchor="start" letter-spacing="-1">The sixth gives you one car</text>
<text x="64" y="408" font-family="Inter ExtraBold" font-size="46" font-weight="normal" fill="#187A4A" text-anchor="start" letter-spacing="-1">and puts you in it.</text>
<text x="64" y="460" font-family="Inter Medium" font-size="17.5" font-weight="normal" fill="#5C5E62" text-anchor="start">The real Bay Area service runs with a safety driver aboard. The driver is you.</text>
