<text x="64" y="96" font-family="Inter ExtraBold" font-size="44" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-0.9">Your cars earn while you watch them.</text>
<text x="64" y="142" font-family="Inter ExtraBold" font-size="44" font-weight="normal" fill="#C0392B" text-anchor="start" letter-spacing="-0.9">They bill you whether you watched or not.</text>
<text x="64" y="190" font-family="Inter Medium" font-size="21" font-weight="normal" fill="#5C5E62" text-anchor="start">You are the remote operator. Clock off and the fleet parks — and midnight still arrives.</text>
<text x="64" y="262" font-family="Inter" font-size="13" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="2">ONE DAY, ONE CAR</text>
