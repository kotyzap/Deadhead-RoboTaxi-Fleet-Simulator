<text x="96" y="510" font-family="Inter" font-size="13" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="1.8">WHAT A CAB OWES AT MIDNIGHT</text>
<text x="96" y="556" font-family="Inter Medium" font-size="18" font-weight="normal" fill="#393C41" text-anchor="start">Fixed cost, whatever it did</text>
<text x="732" y="556" font-family="Inter" font-size="20" font-weight="bold" fill="#171A20" text-anchor="end">$82.00</text>
<line x1="96" y1="572" x2="732" y2="572" stroke="rgba(23,26,32,0.08)"/>
<text x="96" y="600" font-family="Inter Medium" font-size="18" font-weight="normal" fill="#393C41" text-anchor="start">Finance instalment</text>
<text x="732" y="600" font-family="Inter" font-size="20" font-weight="bold" fill="#171A20" text-anchor="end">$19.80</text>
<line x1="96" y1="616" x2="732" y2="616" stroke="rgba(23,26,32,0.08)"/>
<text x="96" y="644" font-family="Inter Medium" font-size="18" font-weight="normal" fill="#393C41" text-anchor="start">…or the rental meter instead</text>
<text x="732" y="644" font-family="Inter" font-size="20" font-weight="bold" fill="#B87503" text-anchor="end">$75.00</text>
<line x1="96" y1="660" x2="732" y2="660" stroke="rgba(23,26,32,0.08)"/>
<text x="96" y="708" font-family="Inter" font-size="19" font-weight="bold" fill="#C0392B" text-anchor="start">It moved for six of those twenty-four hours.</text>
<text x="96" y="734" font-family="Inter Medium" font-size="14.5" font-weight="normal" fill="#8A8D93" text-anchor="start">Cab, the cheapest car in the game.</text>
