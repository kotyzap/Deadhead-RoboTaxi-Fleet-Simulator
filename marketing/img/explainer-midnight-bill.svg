<text x="836" y="512" font-family="Inter" font-size="13" font-weight="bold" fill="#2F55C4" text-anchor="start" letter-spacing="1.6">PAOLO  ·  MESSAGE 14 OF 14</text>
<text x="836" y="574" font-family="Inter" font-size="27" font-weight="bold" fill="#171A20" text-anchor="start">You worked six hours.</text>
<text x="836" y="612" font-family="Inter" font-size="27" font-weight="bold" fill="#171A20" text-anchor="start">The car was billed for twenty-four.</text>
<text x="836" y="666" font-family="Inter Medium" font-size="21" font-weight="normal" fill="#393C41" text-anchor="start">Your margin was you, sitting there for free.</text>
<text x="836" y="696" font-family="Inter Medium" font-size="21" font-weight="normal" fill="#393C41" text-anchor="start">And there's only one of you.</text>
