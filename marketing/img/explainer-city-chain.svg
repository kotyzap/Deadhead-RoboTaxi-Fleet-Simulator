<text x="96" y="680" font-family="Inter" font-size="20" font-weight="bold" fill="#171A20" text-anchor="start">The gate is a finished shift, not a bank balance.</text>
<text x="96" y="705" font-family="Inter Medium" font-size="15" font-weight="normal" fill="#393C41" text-anchor="start">Every locked tab is visible from the first boot, and Paolo has something to say about each one. Phoenix and Las Vegas sit at the end, dashed — nobody has launched there, so neither has the game.</text>
<text x="64" y="772" font-family="Inter" font-size="12.5" font-weight="bold" fill="#8A8D93" text-anchor="start" letter-spacing="1.8">AND THE CITIES YOU LEAVE KEEP BILLING YOU</text>
<text x="64" y="802" font-family="Inter" font-size="17.5" font-weight="bold" fill="#171A20" text-anchor="start">A rented car parked in Miami still owes its fixed cost at midnight while you work Tampa. Three days unpaid and the lender takes it.</text>
