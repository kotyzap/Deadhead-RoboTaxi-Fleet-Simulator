<text x="84" y="71" font-family="Inter" font-size="12" font-weight="bold" fill="#187A4A" text-anchor="start" letter-spacing="1.6">CITY SIX  ·  SAN FRANCISCO</text>
<text x="64" y="148" font-family="Inter ExtraBold" font-size="44" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-0.9">The sixth city takes the fleet away.</text>
<text x="64" y="190" font-family="Inter Medium" font-size="19" font-weight="normal" fill="#5C5E62" text-anchor="start">The real Bay Area service runs with a safety driver in the seat. The driver is you — not an employee, not a line on a payroll.</text>
<g filter="url(#sh2)"><rect x="64" y="246" width="940" height="118" rx="14" fill="rgba(255,255,255,0.82)" opacity="1"/></g>
<rect x="64" y="246" width="940" height="118" rx="14" fill="none" stroke="rgba(23,26,32,0.10)" stroke-width="1" opacity="1"/>
<rect x="64" y="246" width="5" height="118" rx="2.5" fill="#187A4A" opacity="1"/>
<text x="100" y="280" font-family="Inter" font-size="12" font-weight="bold" fill="#187A4A" text-anchor="start" letter-spacing="1.6">FLEET CAP</text>
<text x="100" y="326" font-family="Inter Black" font-size="36" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-1">1</text>
<text x="370" y="302" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">You cannot be in two seats at once. SF has no</text>
<text x="370" y="326" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">fleet. It has one car, because it has one of you.</text>
<g filter="url(#sh2)"><rect x="64" y="380" width="940" height="118" rx="14" fill="rgba(255,255,255,0.82)" opacity="1"/></g>
<rect x="64" y="380" width="940" height="118" rx="14" fill="none" stroke="rgba(23,26,32,0.10)" stroke-width="1" opacity="1"/>
<rect x="64" y="380" width="5" height="118" rx="2.5" fill="#187A4A" opacity="1"/>
<text x="100" y="414" font-family="Inter" font-size="12" font-weight="bold" fill="#187A4A" text-anchor="start" letter-spacing="1.6">SIM SPEED</text>
<text x="100" y="460" font-family="Inter Black" font-size="36" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-1">1×  LOCKED</text>
<text x="370" y="436" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">Every other city runs at 4× or 20×. You cannot</text>
<text x="370" y="460" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">fast-forward through a job you are sitting in.</text>
<g filter="url(#sh2)"><rect x="64" y="514" width="940" height="118" rx="14" fill="rgba(255,255,255,0.82)" opacity="1"/></g>
<rect x="64" y="514" width="940" height="118" rx="14" fill="none" stroke="rgba(23,26,32,0.10)" stroke-width="1" opacity="1"/>
<rect x="64" y="514" width="5" height="118" rx="2.5" fill="#187A4A" opacity="1"/>
<text x="100" y="548" font-family="Inter" font-size="12" font-weight="bold" fill="#187A4A" text-anchor="start" letter-spacing="1.6">THE STIPEND</text>
<text x="100" y="594" font-family="Inter Black" font-size="36" font-weight="normal" fill="#171A20" text-anchor="start" letter-spacing="-1">$250 / day</text>
<text x="370" y="570" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">Axiom pays for the seat — but only on a day you</text>
<text x="370" y="594" font-family="Inter Medium" font-size="16" font-weight="normal" fill="#393C41" text-anchor="start">actually clocked on. Against $38,000, an offset.</text>
<g filter="url(#sh2)"><rect x="1036" y="246" width="500" height="384" rx="14" fill="rgba(255,255,255,0.82)" opacity="1"/></g>
