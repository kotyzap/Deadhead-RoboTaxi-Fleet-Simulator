<line x1="1307.0" y1="312" x2="1307.0" y2="612" stroke="#187A4A" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.75"/>
<rect x="64" y="700" width="1472" height="76" rx="14" fill="rgba(24,122,74,0.07)" stroke="rgba(24,122,74,0.22)" stroke-width="1" opacity="1"/>
<text x="96" y="730" font-family="Inter" font-size="21" font-weight="bold" fill="#171A20" text-anchor="start">Five cities teach you to run a fleet. The sixth gives you one car and puts you in it.</text>
<text x="96" y="756" font-family="Inter Medium" font-size="14.5" font-weight="normal" fill="#393C41" text-anchor="start">The CPUC has said on the record that this is not an autonomous vehicle service — the operator holds the same class of permit a limousine company does. The hostile regulator is real, not invented.</text>
